   <g id="text_1">
    <text style="font-weight: 700; font-size: 19px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.544" y="58.0932" transform="rotate(-0 32.544 58.0932)">What the project developed</text>
   </g>
   <g id="text_2">
    <text style="font-size: 10px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #46566a" x="32.544" y="83.5758" transform="rotate(-0 32.544 83.5758)">Arrows show method development; separate studies do not form one numerical improvement curve.</text>
   </g>
   <g id="text_3">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176b87" x="42.912" y="156.1032" transform="rotate(-0 42.912 156.1032)">SpectralShape → GSP</text>
   </g>
   <g id="text_4">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 183.491406)">Geometric and spectral features</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 198.17707)">Standard learner; inner-fold selection</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 211.991406)">Six-channel source development</text>
   </g>
   <g id="text_5">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #176b87" x="343.584" y="156.1032" transform="rotate(-0 343.584 156.1032)">RMRP → denoised GSP</text>
   </g>
   <g id="text_6">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 183.92707)">Raw, denoised and residual candidates</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 197.741406)">Denoised view selected in every fold</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 211.991406)">Noise gains; temporal-gap harms</text>
   </g>
   <g id="text_7">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #a85c16" x="640.8" y="156.1032" transform="rotate(-0 640.8 156.1032)">CTGR → strict HERA</text>
   </g>
   <g id="text_8">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 183.491406)">Add native gravity for posture</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 197.741406)">Correct uncertain predictions selectively</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 212.911719)">Then ensemble and calibrate</text>
   </g>
   <g id="text_9">
    <text style="font-weight: 700; font-size: 13px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.544" y="265.221" transform="rotate(-0 32.544 265.221)">Separate evidence streams</text>
   </g>
   <g id="text_10">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #718096" x="42.912" y="316.1862" transform="rotate(-0 42.912 316.1862)">Locked target benchmark</text>
   </g>
   <g id="text_11">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 343.574406)">Different target participants and protocol</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 357.824406)">MoRe-HAR hypothesis unsupported</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(42.912 372.074406)">Preserved; not reopened for successors</text>
   </g>
   <g id="text_12">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #718096" x="343.584" y="316.1862" transform="rotate(-0 343.584 316.1862)">Labelled personalization</text>
   </g>
   <g id="text_13">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 343.574406)">SAR / ASGS / semantic-gauge studies</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 357.824406)">Query labels counted and excluded</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(343.584 372.074406)">Separate from zero-query recognition</text>
   </g>
   <g id="text_14">
    <text style="font-weight: 700; font-size: 12px; font-family: 'DejaVu Sans'; text-anchor: start; fill: #718096" x="640.8" y="316.1862" transform="rotate(-0 640.8 316.1862)">External diagnostics</text>
   </g>
   <g id="text_15">
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 343.574406)">HARTH: placement and reference methods</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 358.744719)">AICOS: frozen sensor-interface transfer</text>
    <text style="font-size: 9.5px; font-family: 'DejaVu Sans'" transform="translate(640.8 372.074406)">Explicit limitations and negative results</text>
   </g>
   <g id="text_16">
    <text style="font-size: 9px; font-family: 'DejaVu Sans'; text-anchor: start" x="32.544" y="422.037" transform="rotate(-0 32.544 422.037)">Project contributions are representations and composite pipelines. Extra Trees, Random Forest and filtering primitives retain their established attribution.</text>
   </g>
  </g>
 </g>
