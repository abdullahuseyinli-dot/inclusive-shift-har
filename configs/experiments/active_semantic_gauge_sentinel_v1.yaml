schema_version: "1.0.0"
experiment_id: "inclusivehar-active-semantic-gauge-sentinel-v1"
declared_on: "2026-09-04"
status: "labelled_personalization_protocol_locked_before_first_sentinel_run"
method_name: "Active Semantic-Gauge Sentinel"
method_abbreviation: "ASGS"
base_models:
  gsp:
    result_path: ".audit/v2/geometric-pyramid/nested-001/result.json"
  rmrp:
    result_path: ".audit/v2/robust-multiscale/publication-001/result.json"
method:
  fixed_class: "mobility"
  reconcilable_classes: ["sitting", "standing"]
  candidate_filter: "predicted stationary probability at least 0.5, then fallback if exhausted"
  active_query_utility: "predicted stationary probability times absolute posture log odds"
  random_query_control: "sha256(seed|window_id) order under the same candidate filter"
  minimum_predicted_stationary_probability: 0.5
  minimum_absolute_log_bayes_factor: 1.0986122886681098
  maximum_queries_per_participant: [1, 2, 3]
  seed: 271828
  fixed_sar_seed: 314159
  query_windows_excluded_from_evaluation: true
  label_access_timing: "a query label is read only after its window is selected without labels"
  unresolved_budget_exhaustion_rule: "retain identity"
comparators:
  - "same-remaining-window no adaptation"
  - "random hash query sentinel"
  - "fixed one-per-posture-class SAR (1+1 labels)"
claim_policy:
  zero_shot_claim_allowed: false
  labelled_personalization_only: true
  target_data_allowed: false
  participant_query_count_and_removed_windows_reported: true
  all_budgets_reported_without_best-budget_selection: true
  independent_new_ability_relevant_cohort_required: true
