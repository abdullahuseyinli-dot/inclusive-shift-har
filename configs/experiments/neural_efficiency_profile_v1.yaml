schema_version: "1.0.0"
profile_id: "neural-efficiency-cuda-v1"
config_sha256: "59db7c71322161344f669887a757dd55b1db887a5848b4e3b719147e4939bd78"
status: "configured_not_run"
required_device: "cuda"
input:
  window_length_samples: 128
  channel_count: 6
  batch_sizes: [1, 64]
  synthetic_values: "zeros"
precision_modes:
  - "float32"
  - "float16_autocast"
latency:
  warmup_iterations: 20
  measured_iterations: 100
  percentiles: [50.0, 95.0]
  synchronize_each_iteration: true
complexity:
  mac_definition: "one_scalar_multiply_accumulate"
  flop_per_mac: 2
  counted_modules:
    - "Conv1d"
    - "Linear"
    - "LSTM"
  excluded_operations:
    - "bias additions"
    - "normalization"
    - "activations"
    - "pooling"
    - "softmax"
    - "attention or custom functional kernels not exposed as counted modules"
contention_policy:
  monitor_command: "nvidia-smi"
  query_scope: "selected_device_compute_apps"
  sample_before_run: true
  sample_before_and_after_each_profile: true
  allow_current_process: true
  allowed_ambient_process_names: ["dwm.exe", "explorer.exe"]
  fail_on_unapproved_process: true
output_policy:
  create_only: true
  checkpoint_sha256_required: true
  checkpoint_validation_record_sha256_required: true
