schema_version: "1.0.0"
experiment_id: "inclusivehar-spectral-shape-nested-v1"
declared_on: "2026-09-03"
status: "post_analysis_source_development_target_sealed"
method_origin: "Introduced after neural fixed-refit and committee failures were observed."
feature_contract:
  input_channels: [motionUserAccelerationX, motionUserAccelerationY, motionUserAccelerationZ, motionRotationRateX, motionRotationRateY, motionRotationRateZ]
  window_length: 128
  learned_feature_parameters: false
  families: [robust_moments, derivatives, normalized_spectrum, autocorrelation, channel_correlation, rotation_invariants]
  forbidden_inputs: [participant_id, disability, assistive_device, timestamp, location, released_block_position]
selection:
  unit: participant
  primary: inner_mean_participant_macro_f1
  tie_breakers: [inner_lower_30_percent_participant_macro_f1, complexity_rank, candidate_id]
  outer_labels_used: false
seed: 11
n_jobs: 4
candidates:
  - {id: lda_shrinkage, complexity_rank: 1}
  - {id: logistic_c01, complexity_rank: 2}
  - {id: logistic_c1, complexity_rank: 3}
  - {id: svm_rbf_c1, complexity_rank: 4}
  - {id: svm_rbf_c10, complexity_rank: 5}
  - {id: extra_trees_leaf3, complexity_rank: 6}
  - {id: extra_trees_leaf1, complexity_rank: 7}
  - {id: histogram_gradient, complexity_rank: 8}
claim_policy:
  confirmatory_claim_allowed: false
  independent_external_or_new_cohort_validation_required: true
