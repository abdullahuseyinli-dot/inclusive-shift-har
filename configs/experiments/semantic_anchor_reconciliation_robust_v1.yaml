schema_version: "1.0.0"
experiment_id: "inclusivehar-semantic-anchor-reconciliation-robust-v1"
declared_on: "2026-09-03"
status: "post_analysis_labelled_personalization_declared_before_first_robust_result"
base_result: ".audit/v2/robust-multiscale/publication-001/result.json"
method:
  fixed_class: mobility
  reconcilable_classes: [sitting, standing]
  anchor_selection: "lowest sha256(seed|participant|window_id) within each reconcilable class"
  anchor_budgets_per_reconcilable_class: [1, 3, 5]
  swap_rule: "swap sitting/standing columns only when anchor log Bayes factor reaches threshold"
  minimum_log_bayes_factor: 1.0986122886681098
  seed: 314159
  anchor_windows_excluded_from_evaluation: true
  evaluation_labels_used_for_decision: false
claim_policy:
  zero_shot_claim_allowed: false
  labelled_personalization_claim_only: true
  all_budgets_reported_without_selection: true
  target_data_allowed: false
  independent_external_or_new_cohort_validation_required: true
