execution:
  required_device: "cuda"
  one_process_one_gpu: true
  sequential_runs: true
  required_seed_order: [11, 23, 47, 89, 131]
  selection_seed: 11
  source_checkpoint_rule: "fixed_last_epoch_23_matching_frozen_compact_erm"
  target_stage_after_durable_source_lock: true
  target_tuning_or_refit: false
  mixed_precision: "float16"
training:
  epochs: 23
  batch_size: 256
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  data_loader_workers: 0
  optimizer: "adamw"
  scheduler: "cosine_annealing_per_completed_epoch"
  normalization: "per_channel_population_standardization_fit_source_train_only"
  calibration: "scalar_temperature_fit_source_validation_only_per_final_seed"
methods:
  - model_id: "ccil-paper-loss-compact"
    claim_label: "paper-derived CCIL equations 2-6 on local compact_residual_96; not official code or faithful reproduction"
    architecture: "compact_residual_96"
    official_code_used: false
    paper_doi: "10.1609/aaai.v39i1.32077"
    implementation_module: "inclusive_shift_har.training.ccil_paper.CCILPaperConceptMeanLoss"
    selection_candidates:
      - candidate_id: "alpha-0p01-ema-0p01"
        alpha: 0.01
        ema_update_weight: 0.01
      - candidate_id: "alpha-0p01-ema-0p1"
        alpha: 0.01
        ema_update_weight: 0.1
      - candidate_id: "alpha-0p1-ema-0p01"
        alpha: 0.1
        ema_update_weight: 0.01
      - candidate_id: "alpha-0p1-ema-0p1"
        alpha: 0.1
        ema_update_weight: 0.1
  - model_id: "bpd-boundary-safe-compact-adaptation"
    claim_label: "paper-derived BPD roles re-expressed over local compact_residual_96; boundary-safe protocol adaptation, not official-faithful BPD"
    architecture: "compact_residual_96_generator_plus_local_factorization_heads"
    official_code_used: false
    third_party_code_copied: false
    paper_doi: "10.1145/3517252"
    implementation_module: "inclusive_shift_har.models.paper_adaptations.BPDBoundarySafeCompactAdapter"
    latent_dim: 24
    mine_steps_per_batch: 1
    selection_candidates:
      - candidate_id: "mi-0p0001-confusion-0p1-reconstruction-1"
        mutual_information_weight: 0.0001
        confusion_weight: 0.1
        reconstruction_weight: 1.0
      - candidate_id: "mi-0p0001-confusion-1-reconstruction-1"
        mutual_information_weight: 0.0001
        confusion_weight: 1.0
        reconstruction_weight: 1.0
      - candidate_id: "mi-0p001-confusion-0p1-reconstruction-1"
        mutual_information_weight: 0.001
        confusion_weight: 0.1
        reconstruction_weight: 1.0
      - candidate_id: "mi-0p001-confusion-1-reconstruction-1"
        mutual_information_weight: 0.001
        confusion_weight: 1.0
        reconstruction_weight: 1.0
selection:
  equal_candidate_count_per_method: 4
  fit_partition: "source_train"
  scoring_partition: "source_validation"
  primary_metric: "mean_participant_macro_f1"
  tie_breakers:
    - "worst_participant_macro_f1"
    - "candidate_id_lexicographic"
  target_signals_labels_predictions_or_metrics_allowed: false
statistics:
  statistical_unit: "participant"
  seed_aggregation: "mean_each_participant_across_five_seeds_before_model_comparison"
  comparison_references: ["compact-erm", "more-har-full"]
  participant_bootstrap_resamples: 10000
  participant_bootstrap_seed: 1729
  paired_permutation_samples: 100000
  paired_permutation_seed: 2718
  multiple_comparison_correction: "holm_across_four_adapter_vs_locked_comparator_target_comparisons"
outputs:
  output_directory: "results/postconfirmatory/ccil_bpd_v1"
  selection_lock_filename: "source_selection_lock.json"
  source_stage_lock_filename: "source_stage_lock.json"
  index_filename: "ccil_bpd_postconfirmatory_index.json"
  aggregate_filename: "ccil_bpd_postconfirmatory_aggregate.json"
limitations:
  - "The extension was designed after opening-1 target results existed and is descriptive only."
  - "CCIL has no verified official implementation; only published concept-mean equations are adapted."
  - "BPD's official trainer is not used; local objectives and optimization schedule are an explicitly qualified protocol adaptation."
  - "Only two source-validation participants are available for hyperparameter selection and calibration."
  - "Released trial identifiers and timestamps are absent, so the participant-exclusive released-block protocol is not trial-safe."
  - "Target participants are evaluated through the consumed opening-1 cache; no new confirmatory opening exists."
  - "Compact ERM and MoRe-HAR full comparisons reuse frozen source artifacts and consumed opening-1 results without rerunning either comparator."
forbidden_claims:
  - "official CCIL reproduction"
  - "official or faithful BPD reproduction"
  - "confirmatory evidence"
  - "trial-safe or leakage-safe recordings"
  - "causal disability effect"
  - "fairness or clinical validity"
