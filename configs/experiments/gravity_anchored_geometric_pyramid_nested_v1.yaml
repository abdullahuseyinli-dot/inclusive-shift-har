schema_version: "1.0.0"
experiment_id: "inclusivehar-gravity-anchored-geometric-pyramid-nested-v1"
declared_on: "2026-09-03"
status: "post_analysis_secondary_sensor_sufficiency_target_sealed"
method_origin: "Physical identifiability analysis motivated by source-only posture errors; views fixed before first gravity result."
sensor_contract:
  primary_channels: [motionUserAccelerationX, motionUserAccelerationY, motionUserAccelerationZ, motionRotationRateX, motionRotationRateY, motionRotationRateZ]
  auxiliary_channels: [motionGravityX, motionGravityY, motionGravityZ]
  reconstructed_total_acceleration: "motionUserAcceleration + motionGravity"
  sampling_rate_hz: 50
  forbidden_inputs: [participant_id, disability, assistive_device, timestamp, location, released_block_position, target_record]
selection:
  unit: participant
  primary: inner_mean_participant_macro_f1
  tie_breakers: [inner_lower_30_percent_participant_macro_f1, complexity_rank, candidate_id]
  outer_labels_used: false
seed: 11
n_jobs: 4
candidates:
  - {id: dynamic_extra_trees_leaf1, view: dynamic, estimator: extra_trees_leaf1, complexity_rank: 1, participant_class_weighted: true}
  - {id: total_extra_trees_leaf1, view: total, estimator: extra_trees_leaf1, complexity_rank: 2, participant_class_weighted: true}
  - {id: dual_extra_trees_leaf3, view: dual, estimator: extra_trees_leaf3, complexity_rank: 3, participant_class_weighted: true}
  - {id: dual_extra_trees_leaf1, view: dual, estimator: extra_trees_leaf1, complexity_rank: 4, participant_class_weighted: true}
  - {id: dual_hierarchical_leaf3, view: dual, estimator: hierarchical_forest_leaf3, complexity_rank: 5, participant_class_weighted: true}
claim_policy:
  primary_six_channel_claim_allowed: false
  sensor_sufficiency_claim_only: true
  confirmatory_claim_allowed: false
  independent_external_or_new_cohort_validation_required: true
