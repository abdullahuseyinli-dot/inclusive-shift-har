      subset is DOI 10.34973/2xxa-g520, version 2, approximately 4 GB across 13 files,
      and is not a substitute for the full activity corpus.
    hashes: null
    license: >-
      Full activity-data license/terms are not frozen; public metadata states CC0 for
      the separate tremor subset. No full-data terms were accepted and no bytes from
      either evidence object were acquired locally.
    redistribution: >-
      Full activity-data redistribution is not authorized; the separately CC0 tremor
      subset remains out of scope for HAR confirmation and was not downloaded.
    placement: >-
      Public study article reports Physilog units on both wrists, both ankles, and the
      lower back, alongside smartwatch, smartphone, and Empatica devices.
    channels: >-
      Full request-gated channel inventory is not locally verified; the separate public
      tremor subset reports bilateral wrist accelerometer and gyroscope at 200 Hz.
    ontology: >-
      Public articles report sitting, standing, walking, postural transitions,
      running/exercise, cycling, and motorized driving; the public tremor subset uses
      tremor annotations and is not a general-activity endpoint.
    bias: >-
      Small longitudinal clinical/control cohorts and medication-state observations
      are publicly described; the sealed activity bytes remain unassessed.
    rule: "Steward approval and user-authorized terms are required."
