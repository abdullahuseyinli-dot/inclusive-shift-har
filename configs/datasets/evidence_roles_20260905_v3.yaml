      frozen data release or authorized file receipt exists.
    hashes: null
    license: >-
      Public Synapse project metadata states CC-BY-4.0; file access additionally
      requires an account and user acceptance of applicable Synapse terms, privacy
      policy, code of conduct, and data pledge, none of which was accepted here.
    redistribution: "controlled files unavailable; no local redistribution authorization assessed"
    placement: >-
      Public descriptor reports Xsens IMUs on the forehead, sternum, L4/L5, and
      bilateral wrists, thighs, shanks, ankles, and dorsal feet, plus bilateral
      Moticon insoles.
    channels: >-
      Public descriptor reports Xsens acceleration, angular velocity, magnetic field,
      orientation, and free acceleration at 100 Hz; insoles provide pressure plus
      accelerometer and gyroscope channels at 100 Hz.
    ontology: >-
      Public descriptor reports gait, turning, tandem gait, timed-up-and-go, balance,
      doorway, free-walk, and frame-level general/clinical events; no frozen mapping
      to this repository's three-class endpoint exists.
    bias: >-
      Clinical cross-sectional cohort and multimodal laboratory tasks are publicly
      described; participant-level controlled bytes remain sealed and unassessed.
    rule: "Do not accept agreements, impersonate the user, discover credentials, or bypass controls."
