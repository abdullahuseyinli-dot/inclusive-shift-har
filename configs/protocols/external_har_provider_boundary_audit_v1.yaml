  earlier_results_deleted_or_replaced: false
  result_status_changes_are_create_only: true
  numerical_outcomes_used_to_define_correction: false
discovery:
  discovered_after_external_outcomes: true
  source: "Independent repository and provider-boundary audit"
  consequence: >-
    Existing IMU-HAR-IL within-dataset and IMU-HAR-IL-to-FoG results retain
    artifact-integrity value but are not continuous-stream, label-free publication
    evidence. They are provider-presegmented scripted-activity development diagnostics.
imu_har_il:
  dataset_id: "imu_har_il_v1"
  provider_collection: "CSIRO collection 74700, DOI 10.25919/d7xf-n080"
  collection_api_version: 1
  collection_data_version: 1
  collection_file_count: 83409
  collection_total_size_bytes: 49771532800
  provider_license: "CC-BY-NC-4.0"
  official_repository:
    url: "https://github.com/mmsandhu/IMU-HAR-IL"
    commit: "7d8244db71f5f15e094664df1ebb02315769f0ba"
    readme_sha256: "1dfcca279400537367b4aa4bbe776a64587c5f7d72a21a1fb2ebe61e2fc81579"
  official_paper:
    url: "https://arxiv.org/html/2608.07502v2"
    version: "arXiv v2"
  provider_processing_facts:
    - "Sensors originally remained active through a continuous repetition/session."
    - "The provider then split repetitions into activity segments using labels."
    - "Break periods were removed and segments were manually inspected/corrected."
    - "The public hierarchy is participant/repetition/activity/sensor CSV."
    - "Published Body-WT.csv has no timestamp, sample index, continuous-session offset, or stream identifier."
  repository_behavior:
    file_unit: "one provider activity-segment Body-WT.csv"
    resets_per_file:
      - "causal gravity state"
      - "polyphase-resampling edge state"
      - "window origin and phase"
    numeric_activity_column_used_as_model_feature: false
    source_file_boundary_annotation_independent: false
  scientific_disposition:
    evidence_role: "development"
    evidence_status: "diagnostic_provider_presegmented"
    artifact_integrity_may_be_valid: true
    label_free_continuous_inference_claim_allowed: false
    streaming_claim_allowed: false
    confirmatory_claim_allowed: false
    matched_within_provider_endpoint_reporting_allowed: true
    source_to_target_transfer_claim: >-
      Target-label-blind fitting may be reported, but the source preprocessing is
      provider-label-boundary-conditioned; do not call the full transfer pipeline
      label-free or a continuous-stream deployment validation.
  blocker:
    status: "BLOCKED_PUBLIC_CONTINUOUS_SOURCE_UNAVAILABLE"
    smallest_clearance_action: >-
      Obtain an authorized provider release of the original continuous repetition/session
      files with timestamps or sample offsets and activity intervals, then resample each
      observable continuous segment once and project annotations post hoc.
participant_partition_timing:
  finding: >-
    External loaders historically materialized windows before experiment runners created
    participant fold assignments, contrary to AGENTS.md and the experiment declaration.
  participant_overlap_observed: false
  learned_preprocessing_leakage_observed: false
  artifact_partition_records_observed_disjoint: true
  scientific_disposition: "protocol-governance defect requiring pre-window plans and rerun"
  correction_contract:
    roster_basis: "observable provider inventory before any segmentation/window extraction"
    assignments_frozen_before_windowing: true
    annotations_may_not_change_roster_or_assignments: true
    result_must_bind_roster_assignment_hashes: true
sole_harmony:
  dataset_role: "development"
  evidence_status: "diagnostic"
  confirmation_allowed: false
  clinical_claim_allowed: false
  deployable_claim_allowed: false
  historical_boundary_mode: "camera-annotation bout"
  historical_status: "oracle_diagnostic"
  lanes:
    session_observable:
      role: "development"
      evidence_status: "diagnostic"
      boundary_mode: "participant/session plus timestamp-gap/reset and finite-sensor runs"
      deployable_claim_allowed: false
    camera_bout_oracle:
      role: "oracle_diagnostic"
      evidence_status: "diagnostic"
      boundary_mode: "camera-annotation bout plus finite-sensor runs"
      deployable_claim_allowed: false
  cross_lane_numeric_comparison_allowed: false
  deployable_mode_requirement: >-
    Resample and window complete observable session/gap/finite runs, project camera
    intervals afterwards, and reset temporal state only at observable session or gap
    boundaries. The present offline symmetric-resampling implementation remains a
    development diagnostic and does not yet satisfy zero-lookahead deployment.
har_pmd:
  boundary_mode: "provider scripted recording file with timestamps"
  status: "participant-exclusive mobility-mode stress only"
  streaming_claim_allowed: false
  posture_claim_allowed: false
fog_star:
  boundary_mode: "released participant/session stream plus timestamp gaps and finite runs"
  annotation_independent_repository_pipeline: true
  streaming_claim_allowed: false
  required_additional_correction: "pre-window participant partition plan"
