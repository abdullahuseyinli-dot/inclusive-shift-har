comparison_and_claim_policy:
  lanes_are_matched_before_after_comparisons: false
  reason: >-
    The complete-core and available-valid-trial lanes contain different
    observations and different subsets of the same reported 50 people.
  repetitions_increase_independent_participant_n: false
  evidence_role: "development missing-data sensitivity"
  provider_presegmented_diagnostic_status_preserved: true
  continuous_stream_claim_allowed: false
  confirmation_allowed: false
evidence_basis:
  scope: >-
    The two .audit files are preserved local evidence and are intentionally not
    committed or required in a clean clone. Their SHA-256 values document the
    derivation; the committed protocol and implementation carry the resulting
    exact rosters and normalized inventory hashes.
  complete_core_data_audit:
    path: ".audit/phase2_external_v3/imu_all_3seed_5a585e9/primary_suite/imu_har_il_all_repetitions_3seed/data_audit.json"
    sha256: "04e259bb84967bf888141308566842f3ff79edca60cee7795d76213e7dd1f471"
  available_trial_data_audit:
    path: ".audit/phase2_external_v3/imu_available_retry_3seed_ecafde4_20260905/primary_suite/imu_har_il_available_trials_3seed/data_audit.json"
    sha256: "a667b55b5cc9f6c24e3b86435fe7149a7705eefeaf4e318eb5199cceb99741d6"
  outcome_use: >-
    Only provider identities, byte receipts, missingness, finite-window
    eligibility, and participant/trial counts were used for this guard. Model
    scores do not select either lane.
