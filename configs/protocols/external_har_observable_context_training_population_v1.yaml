    segment_key_replacement: >-
      annotation_dependency=false is replaced by both
      within_declared_segment_transform_annotation_dependency=false and
      segment_boundary_annotation_conditioned=false.
    candidate_pool_addition: "arrays.nine_channel_signals SHA-256"
  fields_required_exact_after_normalization: >-
    Every other dataset-summary field, every pre-existing observable-candidate
    array hash, every segment signal/gravity/timestamp/grid/admission/exclusion
    field, every scored identity, and every unaffected-method probability.
  allowed_use: "historical parity witness only"
metamorphic_acceptance:
  - >-
    Holding candidate signals, fixed predictors, and observable boundaries constant,
    changing annotation eligibility cannot change inner/outer context membership,
    fitted channel scale, fitted physics-reference threshold, context features,
    physics trust decisions, or reliability features.
  - >-
    Ineligible placeholder labels cannot enter fitting, utility, calibration,
    candidate selection, or scoring.
  - "Every candidate is predicted exactly once by a participant-held-out inner model."
preservation:
  historical_results_deleted_or_overwritten: false
  v3_context_results_status: "superseded development evidence"
  before_after_numerical_improvement_claim_allowed: false
claims:
