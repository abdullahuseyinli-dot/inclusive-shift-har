schema_version: "1.0.0"
preprocessing_id: "inclusivehar-raw-total-acceleration-gyro-128-sensitivity-v1"
dataset_id: "inclusivehar_v4"
evidence_status: "post_confirmatory_signal_definition_sensitivity"
channels:
  - "accelerometerAccelerationX"
  - "accelerometerAccelerationY"
  - "accelerometerAccelerationZ"
  - "motionRotationRateX"
  - "motionRotationRateY"
  - "motionRotationRateZ"
signal_definition:
  acceleration: "raw_or_total_device_acceleration_including_gravity"
