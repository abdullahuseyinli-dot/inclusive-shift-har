title = "InclusiveShift-HAR complete-history secret scan"

[extend]
useDefault = true

# Reviewed historical false positives are pinned by finding fingerprint in
# .gitleaksignore. This rule-local AND allowlist covers only the two canonical
# SHA-256 evidence fields in the validated, generated release ci.json record.
[[rules]]
id = "generic-api-key"

[[rules.allowlists]]
description = "Validated secret-scan SHA-256 evidence fields in release ci.json"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|[/\\])ci\.json$''']
regexes = [
  '''^secret_scan":"[0-9a-f]{64}"$''',
  '''^secret_scan\.json":"[0-9a-f]{64}"$''',
]

# Gitleaks' generic assignment heuristic treats these fixed, public model and
# probability identifiers as credentials. The path and complete match must both
# agree, so unrelated assignments remain findings.
[[rules.allowlists]]
description = "Reviewed legacy architecture identifiers"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|[/\\])src[/\\]inclusive_shift_har[/\\]models[/\\]legacy_models\.py$''']
regexes = [
  '''^key == "legacy_cnn1d_h128"$''',
  '''^key == "legacy_joint_bilstm256_cnn128"$''',
  '''^key == "legacy_joint_bilstm512_cnn256"$''',
]

[[rules.allowlists]]
description = "Reviewed HERA probability-array identifier"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|[/\\])configs[/\\]experiments[/\\]hera_posture_gauge_v1\.yaml$''']
regexes = ['''^probability_key: "hera_v1_strict_probabilities"$''']

# Verified SHA-256 of the public access checklist, not an access credential.
# Exact digest + field + generated v3 evidence path only; see the dated review.
[[rules.allowlists]]
description = "Reviewed public access-checklist source hash in external v3 manifests"
condition = "AND"
regexTarget = "match"
paths = ['''(?:^|[/\\])results[/\\]research[/\\]cross_dataset_har_v3[/\\].*\.json$''']
regexes = ['''^CONTROLLED_DATA_ACCESS_CHECKLIST\.md":\s*"71c41f68123709208a6743fefc65e1f93ea3b6c8ef2176b99435f069f9b492a5"$''']
