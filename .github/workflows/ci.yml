name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  INCLUSIVE_SHIFT_HAR_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: offline
  WANDB_DISABLED: "true"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  synthetic-validation:
    name: Synthetic validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        run: uv sync --locked --extra training-cpu --group research

      - name: Run synthetic tests
        run: uv run pytest -q

      - name: Lint
        run: uv run ruff check src tests

      - name: Check formatting
        run: uv run ruff format --check src tests

      - name: Type-check
        run: uv run mypy src tests

  release-security:
    name: Complete-history release security
    needs: synthetic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@d0cc045d04ccac9d8b7881df0226f9e82c39688e
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked release environment
        run: uv sync --locked --extra training-cpu --group research --group release

      - name: Prepare candidate-scoped attestation directory
        shell: bash
        run: mkdir -p ".audit/release-attestations/${GITHUB_SHA}"

      - name: Scan candidate tree and complete reachable Git history
        continue-on-error: true
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python -m inclusive_shift_har.artifacts.release_gate scan-repository \
            --repository-root . \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --created-at-utc "${now}" \
            --output ".audit/release-attestations/${GITHUB_SHA}/repository_scan.json"

      - name: Download and verify pinned Gitleaks archive
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 \
            --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --dir ".audit/release-attestations/${GITHUB_SHA}"
          cd ".audit/release-attestations/${GITHUB_SHA}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          test "$(./gitleaks version)" = "8.30.1"

      - name: Scan complete history for secrets
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          set +e
          "${evidence}/gitleaks" git \
            --no-banner \
            --config .gitleaks.toml \
            --log-opts=--all \
            --report-format json \
            --report-path "${evidence}/gitleaks.json"
          gitleaks_exit=$?
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python -m inclusive_shift_har.artifacts.release_gate validate-secret-scan \
            --repository-root . \
            --report "${evidence}/gitleaks.json" \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --gitleaks-version 8.30.1 \
            --created-at-utc "${now}" \
            --output "${evidence}/secret_scan.json"
          validation_exit=$?
          if [ "${gitleaks_exit}" -ne 0 ] || [ "${validation_exit}" -ne 0 ]; then exit 1; fi

      - name: Audit installed Python dependency licenses
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          uv run pip-licenses --format=json --with-urls --output-file="${evidence}/python_licenses.json"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run python -m inclusive_shift_har.artifacts.release_gate audit-licenses \
            --repository-root . \
            --inventory "${evidence}/python_licenses.json" \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --pip-licenses-version 5.5.5 \
            --created-at-utc "${now}" \
            --output "${evidence}/license_audit.json"

      - name: Run release quality and provenance gates
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          failed=0
          run_gate() {
            gate="$1"
            shift
            if "$@" > "${evidence}/${gate}.log" 2>&1; then
              printf 'pass\n' > "${evidence}/${gate}.status"
            else
              printf 'fail\n' > "${evidence}/${gate}.status"
              failed=1
            fi
          }
          run_gate tests uv run pytest -q
          run_gate lint uv run ruff check src tests
          run_gate format uv run ruff format --check src tests
          run_gate types uv run mypy src tests
          run_gate manifests uv run inclusive-shift-har validate-manifests --json
          run_gate splits uv run inclusive-shift-har audit-splits \
            --split-manifest results/protocol/splits/inclusivehar_v4_released_block_v1_2.json \
            --json
          run_gate configuration uv run pytest -q tests/test_few_person_protocol.py \
            tests/test_protocol_splits.py tests/test_schema_documents.py \
            tests/test_uci_source_protocol.py
          run_gate artifacts uv run inclusive-shift-har validate-artifacts \
            --artifact-root results --require-artifacts --json
          exit "${failed}"

      - name: Assemble exact-candidate gate evidence
        if: always()
        shell: bash
        run: |
          uv run python - <<'PY'
          import hashlib
          import json
          import os
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from inclusive_shift_har.manifests.canonical import canonical_json_sha256

          candidate = os.environ["GITHUB_SHA"]
          root = Path(".audit/release-attestations") / candidate
          generic_gates = [
              "tests", "lint", "format", "types", "manifests", "splits",
              "configuration", "artifacts", "ci",
          ]
          statuses = {
              gate: (root / f"{gate}.status").read_text(encoding="utf-8").strip()
              for gate in generic_gates
              if gate != "ci"
          }
          quality_status = "pass" if all(
              statuses.get(gate) == "pass" for gate in generic_gates if gate != "ci"
          ) else "fail"
          quality = {
              "schema_version": "1.0.0",
              "record_kind": "ci_release_quality_gate_evidence",
              "status": quality_status,
              "candidate_commit": candidate,
              "gates": generic_gates,
              "gate_statuses": {**statuses, "ci": quality_status},
              "scope": "upstream synthetic-validation matrix and preceding release-security steps",
          }
          quality["record_sha256"] = canonical_json_sha256(quality)
          quality_path = root / "quality_gates.json"
          quality_path.write_text(json.dumps(quality, sort_keys=True) + "\n", encoding="utf-8")
          paths = {
              "repository_scan": root / "repository_scan.json",
              "secret_scan": root / "secret_scan.json",
              "license_audit": root / "license_audit.json",
              **{gate: quality_path for gate in generic_gates},
          }
          def reference(path: Path) -> dict[str, str]:
              return {
                  "status": "pass",
                  "path": path.as_posix(),
                  "expected_sha256": hashlib.sha256(path.read_bytes()).hexdigest(),
              }
          parent = subprocess.run(
              ["git", "rev-parse", f"{candidate}^"],
              check=True,
              capture_output=True,
              text=True,
          ).stdout.strip()
          spec = {
              "schema_version": "1.0.0",
              "spec_kind": "final_release_gate_attestation_spec",
              "created_at_utc": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "candidate_commit": candidate,
              "parent_commit": parent,
              "worktree_clean": True,
              "gates": {name: reference(path) for name, path in paths.items()},
          }
          (root / "attestation_spec.json").write_text(
              json.dumps(spec, sort_keys=True) + "\n", encoding="utf-8"
          )
          PY
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          uv run python -m inclusive_shift_har.artifacts.release_gate assemble \
            --repository-root . \
            --policy configs/release/release_gate_policy_v1.json \
            --mode exact_candidate_attestation \
            --created-at-utc "${now}" \
            --spec "${evidence}/attestation_spec.json" \
            --output "${evidence}/final_release_gate_report.json"
          uv run python -m inclusive_shift_har.artifacts.release_gate validate \
            --report "${evidence}/final_release_gate_report.json" \
            --repository-root .

      - name: Validate tracked precommit report
        if: always()
        run: >-
          uv run python -m inclusive_shift_har.artifacts.release_gate validate
          --report results/release/final_release_gate_report.json
          --repository-root .

      - name: Upload sanitized release-security evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: release-security-${{ github.sha }}
          path: |
            .audit/release-attestations/${{ github.sha }}/repository_scan.json
            .audit/release-attestations/${{ github.sha }}/secret_scan.json
            .audit/release-attestations/${{ github.sha }}/license_audit.json
            .audit/release-attestations/${{ github.sha }}/quality_gates.json
            .audit/release-attestations/${{ github.sha }}/attestation_spec.json
            .audit/release-attestations/${{ github.sha }}/final_release_gate_report.json
            .audit/release-attestations/${{ github.sha }}/*.status
            .audit/release-attestations/${{ github.sha }}/*.log
          if-no-files-found: error
          retention-days: 30
