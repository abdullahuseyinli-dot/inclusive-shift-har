name: CI

on:
  push:
    branches:
      - main
      - 'research/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  GIT_NO_REPLACE_OBJECTS: "1"
  INCLUSIVE_SHIFT_HAR_OFFLINE: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  WANDB_MODE: offline
  WANDB_DISABLED: "true"
  UV_FROZEN: "1"
  UV_NO_PROGRESS: "1"

jobs:
  synthetic-validation:
    name: Synthetic validation (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - windows-latest

    steps:
      - name: Preserve Git blob line endings on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git config --global core.autocrlf false
          git config --global core.longpaths true

      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked development environment
        env:
          # --locked verifies pyproject.toml against uv.lock; explicitly
          # disable the global frozen default for this synchronization only.
          UV_FROZEN: "false"
        run: uv sync --locked --extra training-cpu --group research

      - name: Install hash-locked external research overlay
        run: uv pip install --python .venv --require-hashes -r requirements/external-har-research.lock

      - name: Run complete synthetic collection in audited shards
        run: uv run --no-sync python -m inclusive_shift_har.artifacts.parallel_test_gate --output .audit/ci-test-shards --workers 2

      - name: Preserve synthetic test collection and reports
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: synthetic-tests-${{ matrix.os }}-${{ github.sha }}
          path: .audit/ci-test-shards
          include-hidden-files: true

      - name: Lint
        run: uv run --no-sync ruff check src tests

      - name: Check formatting
        run: uv run --no-sync ruff format --check src tests

      - name: Type-check
        run: uv run --no-sync mypy src tests

      - name: Validate tracked research manifests
        run: uv run --no-sync inclusive-shift-har validate-manifests --json

      - name: Audit locked participant splits
        run: >-
          uv run --no-sync inclusive-shift-har audit-splits
          --split-manifest results/protocol/splits/inclusivehar_v4_released_block_v1_2.json
          --json

      - name: Validate retained research artifacts
        run: >-
          uv run --no-sync inclusive-shift-har validate-artifacts
          --artifact-root results --require-artifacts --json

      - name: Parse every research configuration
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import json
          from pathlib import Path
          import yaml
          paths = sorted(Path('configs').rglob('*.yaml')) + sorted(Path('configs').rglob('*.json'))
          assert paths, 'No research configurations found'
          for path in paths:
              with path.open(encoding='utf-8') as stream:
                  yaml.safe_load(stream) if path.suffix == '.yaml' else json.load(stream)
          print(json.dumps({'configuration_count': len(paths), 'syntax_status': 'PASS'}))
          PY

      - name: Verify dependency lock freshness offline
        env:
          UV_FROZEN: "false"
        run: uv lock --check --offline

      - name: Verify retained Git object integrity
        run: git fsck --full

  release-security:
    name: Complete-history release security
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: synthetic-validation
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out complete history without persisted credentials
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.11"

      - name: Set up uv
        uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d
        with:
          version: "0.11.29"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install locked release environment
        env:
          # Keep --locked as the freshness gate, then restore UV_FROZEN for
          # every subsequent uv invocation in the job.
          UV_FROZEN: "false"
        run: uv sync --locked --extra training-cpu --group research --group release

      - name: Install hash-locked external research overlay
        run: uv pip install --python .venv --require-hashes -r requirements/external-har-research.lock

      - name: Prepare candidate-scoped attestation directory
        shell: bash
        run: mkdir -p ".audit/release-attestations/${GITHUB_SHA}"

      - name: Scan candidate tree and complete reachable Git history
        continue-on-error: true
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run --no-sync python -m inclusive_shift_har.artifacts.release_gate scan-repository \
            --repository-root . \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --created-at-utc "${now}" \
            --output ".audit/release-attestations/${GITHUB_SHA}/repository_scan.json"

      - name: Download and verify pinned Gitleaks archive
        continue-on-error: true
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v8.30.1 \
            --repo gitleaks/gitleaks \
            --pattern gitleaks_8.30.1_linux_x64.tar.gz \
            --dir ".audit/release-attestations/${GITHUB_SHA}"
          cd ".audit/release-attestations/${GITHUB_SHA}"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  gitleaks_8.30.1_linux_x64.tar.gz" | sha256sum --check --strict
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          test "$(./gitleaks version)" = "8.30.1"

      - name: Scan complete history for secrets
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          set +e
          "${evidence}/gitleaks" git \
            --no-banner \
            --config .gitleaks.toml \
            --exit-code 1 \
            --log-opts=--all \
            --report-format json \
            --report-path "${evidence}/gitleaks.json"
          gitleaks_exit=$?
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run --no-sync python -m inclusive_shift_har.artifacts.release_gate validate-secret-scan \
            --repository-root . \
            --report "${evidence}/gitleaks.json" \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --config .gitleaks.toml \
            --ignore .gitleaksignore \
            --gitleaks-version 8.30.1 \
            --gitleaks-exit-code "${gitleaks_exit}" \
            --created-at-utc "${now}" \
            --output "${evidence}/secret_scan.json"
          validation_exit=$?
          if [ "${gitleaks_exit}" -ne 0 ] || [ "${validation_exit}" -ne 0 ]; then exit 1; fi

      - name: Audit installed Python dependency licenses
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          uv run --no-sync pip-licenses --format=json --with-urls --output-file="${evidence}/python_licenses.json"
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          uv run --no-sync python -m inclusive_shift_har.artifacts.release_gate audit-licenses \
            --repository-root . \
            --inventory "${evidence}/python_licenses.json" \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --pip-licenses-version 5.5.5 \
            --created-at-utc "${now}" \
            --output "${evidence}/license_audit.json"

      - name: Run release quality and provenance gates
        continue-on-error: true
        shell: bash
        run: |
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          failed=0
          run_gate() {
            gate="$1"
            shift
            date -u +%Y-%m-%dT%H:%M:%SZ > "${evidence}/${gate}.started"
            set +e
            "$@" > "${evidence}/${gate}.log" 2>&1
            gate_exit=$?
            set -e
            printf '%s\n' "${gate_exit}" > "${evidence}/${gate}.exit"
            date -u +%Y-%m-%dT%H:%M:%SZ > "${evidence}/${gate}.completed"
            if [ "${gate_exit}" -eq 0 ]; then
              printf 'pass\n' > "${evidence}/${gate}.status"
            else
              printf 'fail\n' > "${evidence}/${gate}.status"
              failed=1
            fi
          }
          run_gate tests uv run --no-sync python -m inclusive_shift_har.artifacts.parallel_test_gate --output "${evidence}/test-shards" --workers 2
          run_gate lint uv run --no-sync ruff check src tests
          run_gate format uv run --no-sync ruff format --check src tests
          run_gate types uv run --no-sync mypy src tests
          run_gate manifests uv run --no-sync inclusive-shift-har validate-manifests --json
          run_gate splits uv run --no-sync inclusive-shift-har audit-splits \
            --split-manifest results/protocol/splits/inclusivehar_v4_released_block_v1_2.json \
            --json
          run_gate configuration uv run --no-sync pytest -q tests/test_few_person_protocol.py \
            tests/test_protocol_splits.py tests/test_schema_documents.py \
            tests/test_uci_source_protocol.py
          run_gate artifacts uv run --no-sync inclusive-shift-har validate-artifacts \
            --artifact-root results --require-artifacts --json
          exit "${failed}"

      - name: Assemble candidate-scoped CI quality proxy
        if: always()
        shell: bash
        run: |
          uv run --no-sync python - <<'PY'
          import hashlib
          import json
          import os
          import platform
          import subprocess
          from datetime import UTC, datetime
          from pathlib import Path
          from inclusive_shift_har.manifests.canonical import canonical_json_sha256

          candidate = os.environ["GITHUB_SHA"]
          root = Path(".audit/release-attestations") / candidate
          generic_gates = [
              "tests", "lint", "format", "types", "manifests", "splits",
              "configuration", "artifacts", "ci_quality_proxy",
          ]
          executed = [gate for gate in generic_gates if gate != "ci_quality_proxy"]
          statuses = {}
          gate_evidence = {}
          for gate in executed:
              status_path = root / f"{gate}.status"
              exit_path = root / f"{gate}.exit"
              log_path = root / f"{gate}.log"
              started_path = root / f"{gate}.started"
              completed_path = root / f"{gate}.completed"
              status = (
                  status_path.read_text(encoding="utf-8").strip()
                  if status_path.is_file()
                  else "fail"
              )
              statuses[gate] = status if status in {"pass", "fail"} else "fail"
              exit_code = (
                  int(exit_path.read_text(encoding="utf-8").strip())
                  if exit_path.is_file()
                  else -1
              )
              log_payload = log_path.read_bytes() if log_path.is_file() else b""
              gate_evidence[gate] = {
                  "exit_code": exit_code,
                  "started_at_utc": (
                      started_path.read_text(encoding="utf-8").strip()
                      if started_path.is_file()
                      else None
                  ),
                  "completed_at_utc": (
                      completed_path.read_text(encoding="utf-8").strip()
                      if completed_path.is_file()
                      else None
                  ),
                  "log_path": log_path.as_posix(),
                  "log_size_bytes": len(log_payload),
                  "log_sha256": hashlib.sha256(log_payload).hexdigest(),
              }
          quality_status = "pass" if all(
              statuses.get(gate) == "pass" for gate in executed
          ) else "fail"
          def version(*command: str) -> str:
              result = subprocess.run(command, check=True, capture_output=True, text=True)
              return (result.stdout or result.stderr).strip().splitlines()[0]
          quality = {
              "schema_version": "1.0.0",
              "record_kind": "ci_release_quality_gate_evidence",
              "status": quality_status,
              "candidate_commit": candidate,
              "created_at_utc": datetime.now(UTC).strftime("%Y-%m-%dT%H:%M:%SZ"),
              "gates": generic_gates,
              "gate_statuses": {**statuses, "ci_quality_proxy": quality_status},
              "scope": "upstream synthetic-validation matrix and preceding release-security steps",
              "ci_evidence_scope": "within_job_quality_proxy_not_completed_workflow",
              "external_completed_ci_required_for_release_inventory": True,
              "gate_evidence": gate_evidence,
              "tool_versions": {
                  "python": platform.python_version(),
                  "uv": version("uv", "--version"),
                  "pytest": version("uv", "run", "pytest", "--version"),
                  "ruff": version("uv", "run", "ruff", "--version"),
                  "mypy": version("uv", "run", "mypy", "--version"),
              },
              "machine": {
                  "runner_os": os.environ.get("RUNNER_OS"),
                  "architecture": platform.machine(),
                  "platform": platform.platform(),
              },
          }
          quality["record_sha256"] = canonical_json_sha256(quality)
          quality_path = root / "quality_gates.json"
          quality_path.write_text(json.dumps(quality, sort_keys=True) + "\n", encoding="utf-8")
          PY

      - name: Validate candidate-scoped CI gate bundle
        shell: bash
        run: |
          now="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          evidence=".audit/release-attestations/${GITHUB_SHA}"
          uv run --no-sync python -m inclusive_shift_har.artifacts.release_gate validate-ci-bundle \
            --repository-root . \
            --candidate-commit "${GITHUB_SHA}" \
            --policy configs/release/release_gate_policy_v1.json \
            --created-at-utc "${now}" \
            --evidence-root "${evidence}" \
            --output "${evidence}/ci_bundle_validation.json"

      - name: Validate tracked precommit report
        if: always()
        run: >-
          uv run --no-sync python -m inclusive_shift_har.artifacts.release_gate validate
          --report results/release/final_release_gate_report.json
          --repository-root .

      - name: Upload sanitized release-security evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: release-security-${{ github.sha }}
          path: |
            .audit/release-attestations/${{ github.sha }}/repository_scan.json
            .audit/release-attestations/${{ github.sha }}/secret_scan.json
            .audit/release-attestations/${{ github.sha }}/license_audit.json
            .audit/release-attestations/${{ github.sha }}/quality_gates.json
            .audit/release-attestations/${{ github.sha }}/ci_bundle_validation.json
            .audit/release-attestations/${{ github.sha }}/*.status
            .audit/release-attestations/${{ github.sha }}/*.exit
            .audit/release-attestations/${{ github.sha }}/*.started
            .audit/release-attestations/${{ github.sha }}/*.completed
            .audit/release-attestations/${{ github.sha }}/*.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
